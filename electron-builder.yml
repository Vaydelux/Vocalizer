# electron-builder configuration — Windows x64 NSIS installer.
#
# Build layout (after `tsc -p electron/tsconfig.json` + `ELECTRON_BUILD=1 next build`):
#   electron/dist/{main,preload,shared}/*.js   (compiled Electron code)
#   electron/build/                            (buildResources: icon, etc.)
#   out/                                       (Next.js static export → renderer)
#   resources/binaries/{ffmpeg,ffprobe}.exe    (bundled, asar-unpacked)
#
# FFmpeg/FFprobe are bundled as extraResources (real executables on disk, not in
# asar) and resolved at runtime from process.resourcesPath/binaries. No global
# Node/Python/FFmpeg is required on the user's machine.

appId: io.vaydelux.vocalizer
productName: Local Audio Studio
copyright: Copyright (c) Local Audio Studio
directories:
  output: release
  buildResources: electron/build
# Electron entrypoint is declared in package.json ("main").
files:
  - out/**
  - electron/dist/**
  - package.json
extraResources:
  - from: resources/binaries/
    to: binaries/
    filter: ["**/*"]
  # Bundled inference runtime (PyInstaller onedir worker) — built on Windows via
  # inference/worker/inference-worker.spec. Created by CI/manual packaging.
  - from: inference-dist/windows-x64/
    to: inference/
    filter: ["**/*"]
  # Deliberately no default model in this preview build. The model's
  # redistribution rights are unverified; see inference/models/PROVENANCE.md.
  # A separate release configuration must add approved weights only after
  # licensing, checksum and offline inference acceptance gates pass.
# Preload scripts must be unpacked from asar (sandboxed preloads cannot load from asar).
asarUnpack:
  - electron/dist/preload/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/build/icon.ico
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
# Code signing is a documented blocker (no cert in this environment).
# Configure CSC_LINK / CSC_KEY_PASSWORD on a Windows build host before release.
