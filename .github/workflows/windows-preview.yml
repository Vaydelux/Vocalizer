name: Windows Debug EXE (no installer)

on:
  workflow_dispatch:
    inputs:
      include_installer:
        description: "Also build an optional dated NSIS setup file"
        type: boolean
        default: false
      create_draft_release:
        description: "Create/update a GitHub DRAFT prerelease (never auto-publish)"
        type: boolean
        default: false
  push:
    branches: [main, phase4/stability-recovery]

permissions:
  contents: read

# A new release-branch revision supersedes older unsigned preview builds.
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install app packages
        run: bun install --frozen-lockfile
      - name: Static checks
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install CPU inference dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r inference/requirements/cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package isolated Windows worker
        shell: pwsh
        run: |
          python -m PyInstaller inference/worker/inference-worker.spec --noconfirm --clean --distpath inference-dist/staging --workpath inference/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force inference-dist | Out-Null
          Move-Item inference-dist/staging/inference-worker inference-dist/windows-x64
          '{"worker":"inference-worker.exe","protocolVersion":1,"platform":"windows-x64","builtWithPyInstaller":true}' | Set-Content -Encoding UTF8 inference-dist/windows-x64/runtime-manifest.json
          python scripts/smoke-worker.py --exe inference-dist/windows-x64/inference-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire FFmpeg and FFprobe for preview
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:ChocolateyInstall "lib/ffmpeg"
          $ffmpeg = Get-ChildItem $package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw "FFmpeg and FFprobe not found after installation" }
          New-Item -ItemType Directory -Force resources/binaries | Out-Null
          Copy-Item $ffmpeg.FullName resources/binaries/ffmpeg.exe
          Copy-Item $ffprobe.FullName resources/binaries/ffprobe.exe
          & resources/binaries/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare preview icon
        run: python scripts/create-preview-icon.py
      - name: Record stable UTC build date
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          "BUILD_DATE=$date" >> $env:GITHUB_ENV
      - name: Build unpacked Windows debug executable
        shell: pwsh
        run: |
          bun run dist:win:debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "release/win-unpacked"
          $exe = Join-Path $root "Vocalizer.exe"
          foreach ($required in @(
            $exe,
            (Join-Path $root "resources/app.asar"),
            (Join-Path $root "resources/inference/inference-worker.exe"),
            (Join-Path $root "resources/binaries/ffmpeg.exe"),
            (Join-Path $root "resources/binaries/ffprobe.exe")
          )) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing debug runtime file: $required" }
          }
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0Vocalizer.exe" --vocalizer-debug
          '@ | Set-Content -Encoding ASCII (Join-Path $root "Run-Vocalizer-Debug.cmd")
          @'
          VOCALIZER 0.3.0 - WINDOWS X64 UNPACKED DEBUG BUILD
          Extract the entire ZIP. Keep the resources folder beside Vocalizer.exe.
          Run "Run-Vocalizer-Debug.cmd" to open the app with developer tools,
          or double-click Vocalizer.exe to run normally.
          No installer is required. No default AI model weights are bundled.
          This unsigned build has not completed Windows GUI/runtime acceptance.
          '@ | Set-Content -Encoding UTF8 (Join-Path $root "README-DEBUG.txt")
          # Generate synthetic, original audio to verify a real native
          # Electron IPC -> FFmpeg trim -> FFprobe workflow.
          $env:VOCALIZER_SMOKE_AUDIO = Join-Path $env:RUNNER_TEMP "vocalizer-smoke-input.wav"
          $env:VOCALIZER_SMOKE_EXPORT = Join-Path $env:RUNNER_TEMP "vocalizer-smoke-output.wav"
          & (Join-Path $root "resources/binaries/ffmpeg.exe") -hide_banner -loglevel error -nostdin -n -f lavfi -i "sine=frequency=440:duration=2" -c:a pcm_s16le $env:VOCALIZER_SMOKE_AUDIO
          if ($LASTEXITCODE -ne 0) { throw "Could not generate synthetic smoke audio" }
          # Test actual packaged Electron UI, preload, native FFmpeg/FFprobe,
          # worker detection, and media export. Not a real AI model test.
          $stdout = Join-Path $env:RUNNER_TEMP "vocalizer-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "vocalizer-smoke.stderr.log"
          $process = Start-Process -FilePath (Resolve-Path $exe).Path `
            -ArgumentList "--vocalizer-smoke-test" -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged Electron startup smoke test exceeded 90 seconds"
          }
          $exitCode = $process.ExitCode
          if (Test-Path $stdout) { Get-Content $stdout | Select-Object -Last 40 }
          if (Test-Path $stderr) { Get-Content $stderr | Select-Object -Last 40 }
          if ($exitCode -ne 0) { throw "Packaged Electron startup smoke failed with exit code $exitCode" }
          Write-Host "Packaged Electron startup smoke PASSED"
          $name = "Vocalizer-$env:BUILD_DATE-Windows-x64-Debug"
          $zip = Join-Path "release" "$name.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $root).Path,
            (Join-Path (Get-Location) $zip),
            [System.IO.Compression.CompressionLevel]::Fastest,
            $false
          )
          $files = @($exe, $zip)
          foreach ($item in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $item
            Write-Host "$($hash.Hash)  $($hash.Path)"
          }
          Write-Host "Portable debug ZIP created at $zip"
      - name: Upload dated portable debug ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Debug
          path: release/Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Debug.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build optional dated Windows setup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_installer }}
        shell: pwsh
        run: |
          bun run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $original = "release/Vocalizer-0.3.0-x64-setup.exe"
          if (!(Test-Path -LiteralPath $original -PathType Leaf)) { throw "Missing NSIS setup" }
          $named = "release/Vocalizer-$env:BUILD_DATE-Windows-x64-Setup.exe"
          Copy-Item -LiteralPath $original -Destination $named
          Get-FileHash -Algorithm SHA256 $named | Format-List
      - name: Upload optional dated setup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Setup
          path: release/Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft_release:
    # A draft release is a private staging artifact, NOT a public release.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.create_draft_release) }}
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Use UTC date for deterministic release title and file names
        run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Download dated debug ZIP
        uses: actions/download-artifact@v4
        with:
          name: Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Debug
          path: release-files
      - name: Download optional setup
        if: ${{ inputs.include_installer }}
        uses: actions/download-artifact@v4
        with:
          name: Vocalizer-${{ env.BUILD_DATE }}-Windows-x64-Setup
          path: release-files
      - name: Create or update GitHub DRAFT prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="debug-$BUILD_DATE"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Vocalizer $BUILD_DATE Windows Debug" \
              --draft --prerelease \
              --notes "Unsigned Windows debug preview. Portable folder ZIP; no installer needed. Not validated on a clean Windows PC. No bundled model weights. Do not publish until licensing and runtime tests are approved."
          fi
          gh release upload "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --clobber

