name: Windows Debug EXE (no installer)

on:
  workflow_dispatch:
  push:
    branches: [release/initial-windows-readiness, phase2/windows-inference-integration]

permissions:
  contents: read

# A new release-branch revision supersedes older unsigned preview builds.
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install app packages
        run: bun install --frozen-lockfile
      - name: Static checks
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install CPU inference dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r inference/requirements/cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package isolated Windows worker
        shell: pwsh
        run: |
          python -m PyInstaller inference/worker/inference-worker.spec --noconfirm --clean --distpath inference-dist/staging --workpath inference/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force inference-dist | Out-Null
          Move-Item inference-dist/staging/inference-worker inference-dist/windows-x64
          '{"worker":"inference-worker.exe","protocolVersion":1,"platform":"windows-x64","builtWithPyInstaller":true}' | Set-Content -Encoding UTF8 inference-dist/windows-x64/runtime-manifest.json
          python scripts/smoke-worker.py --exe inference-dist/windows-x64/inference-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire FFmpeg and FFprobe for preview
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:ChocolateyInstall "lib/ffmpeg"
          $ffmpeg = Get-ChildItem $package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw "FFmpeg and FFprobe not found after installation" }
          New-Item -ItemType Directory -Force resources/binaries | Out-Null
          Copy-Item $ffmpeg.FullName resources/binaries/ffmpeg.exe
          Copy-Item $ffprobe.FullName resources/binaries/ffprobe.exe
          & resources/binaries/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare preview icon
        run: python scripts/create-preview-icon.py
      - name: Build unpacked Windows debug executable
        shell: pwsh
        run: |
          bun run dist:win:debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "release/win-unpacked"
          $exe = Join-Path $root "Vocalizer.exe"
          foreach ($required in @(
            $exe,
            (Join-Path $root "resources/app.asar"),
            (Join-Path $root "resources/inference/inference-worker.exe"),
            (Join-Path $root "resources/binaries/ffmpeg.exe"),
            (Join-Path $root "resources/binaries/ffprobe.exe")
          )) {
            if (!(Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing debug runtime file: $required" }
          }
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0Vocalizer.exe" --vocalizer-debug
          '@ | Set-Content -Encoding ASCII (Join-Path $root "Run-Vocalizer-Debug.cmd")
          @'
          VOCALIZER 0.3.0 - WINDOWS X64 UNPACKED DEBUG BUILD
          Extract the entire ZIP. Keep the resources folder beside Vocalizer.exe.
          Run "Run-Vocalizer-Debug.cmd" to open the app with developer tools,
          or double-click Vocalizer.exe to run normally.
          No installer is required. No default AI model weights are bundled.
          This unsigned build has not completed Windows GUI/runtime acceptance.
          '@ | Set-Content -Encoding UTF8 (Join-Path $root "README-DEBUG.txt")
          Get-FileHash -Algorithm SHA256 $exe | Format-List
          Write-Host "Unpacked debug EXE created at $exe"
      - name: Upload unpacked debug EXE (no installer)
        uses: actions/upload-artifact@v4
        with:
          name: Vocalizer-0.3.0-windows-x64-debug
          path: release/win-unpacked/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 14
