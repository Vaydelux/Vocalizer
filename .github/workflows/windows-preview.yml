name: Windows Preview (unsigned, no model weights)

on:
  workflow_dispatch:
  push:
    branches: [release/initial-windows-readiness, phase2/windows-inference-integration]

permissions:
  contents: read

# A new release-branch revision supersedes older unsigned preview builds.
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install app packages
        run: bun install --frozen-lockfile
      - name: Static checks
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install CPU inference dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r inference/requirements/cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package isolated Windows worker
        shell: pwsh
        run: |
          python -m PyInstaller inference/worker/inference-worker.spec --noconfirm --clean --distpath inference-dist/staging --workpath inference/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force inference-dist | Out-Null
          Move-Item inference-dist/staging/inference-worker inference-dist/windows-x64
          '{"worker":"inference-worker.exe","protocolVersion":1,"platform":"windows-x64","builtWithPyInstaller":true}' | Set-Content -Encoding UTF8 inference-dist/windows-x64/runtime-manifest.json
          python scripts/smoke-worker.py --exe inference-dist/windows-x64/inference-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire FFmpeg and FFprobe for preview
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:ChocolateyInstall "lib/ffmpeg"
          $ffmpeg = Get-ChildItem $package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw "FFmpeg and FFprobe not found after installation" }
          New-Item -ItemType Directory -Force resources/binaries | Out-Null
          Copy-Item $ffmpeg.FullName resources/binaries/ffmpeg.exe
          Copy-Item $ffprobe.FullName resources/binaries/ffprobe.exe
          & resources/binaries/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare preview icon
        run: python scripts/create-preview-icon.py
      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          bun run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @(Get-ChildItem release -Filter "*setup.exe")
          if ($artifacts.Count -eq 0) { throw "No NSIS installer was produced" }
          Get-FileHash $artifacts[0].FullName -Algorithm SHA256
      - name: Upload internal preview (NOT an offline AI release)
        uses: actions/upload-artifact@v4
        with:
          name: vocalizer-windows-unsigned-preview
          path: release/*setup.exe
          if-no-files-found: error
          retention-days: 14
