name: Validate source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded source builds when a PR receives a newer commit.
concurrency:
  group: validate-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check renderer TypeScript
        run: bun run typecheck
      - name: Check Electron TypeScript
        run: bun run typecheck:electron
      - name: Studio TypeScript unit tests
        run: bun run test
      - name: Verify Python syntax
        run: python -m compileall -q inference/worker scripts/verify-separation.py
      - name: Worker protocol and cancellation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Benchmark synthetic native stem byte-range streaming
        run: bun scripts/benchmark-stem-stream.ts --output reports/stem-stream-linux.json
      - name: Upload native streaming benchmark (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: vocalizer-stem-stream-linux-${{ github.sha }}
          path: reports/stem-stream-linux.json
          retention-days: 14
          if-no-files-found: error
      - name: Benchmark incremental waveform peak extraction
        run: bun scripts/benchmark-peaks.ts --output reports/peak-benchmark-linux.json
      - name: Upload incremental peak benchmark (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: vocalizer-peak-benchmark-linux-${{ github.sha }}
          path: reports/peak-benchmark-linux.json
          retention-days: 14
          if-no-files-found: error
      - name: Soak-test synthetic 90-minute waveform cache
        run: bun scripts/soak-waveform-cache.ts --output reports/waveform-cache-soak-linux.json
      - name: Upload waveform cache soak (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: vocalizer-waveform-cache-soak-linux-${{ github.sha }}
          path: reports/waveform-cache-soak-linux.json
          retention-days: 14
          if-no-files-found: error
      - name: Build Electron static renderer
        run: bun run electron:build-renderer
      - name: Compile Electron
        run: bun run electron:compile
      - name: Assert bundled sandbox preload bridge
        run: node scripts/test-preload-bundle.mjs
      - name: Test new DAW and compliance regression suites
        run: |
          node scripts/test-compliance-report.mjs
          node scripts/test-mixer-bounce.mjs
          node scripts/test-spatial-mix.mjs
          node scripts/test-automation-bounce.mjs
          node scripts/test-batch-recipe.mjs
          node scripts/test-lossless-trim.mjs
      - name: Test safe native export finalization
        run: node scripts/test-safe-export.mjs
      - name: Test native FFmpeg cancellation during verification
        run: node scripts/test-ffmpeg-cancel-verify.mjs
      - name: Test native Karaoke microphone alignment
        run: node scripts/test-mix-timing.mjs
      - name: Test microphone staging and container integrity
        run: node scripts/test-recording-staging.mjs
      - name: Test AI stem isolation and no-overwrite publishing
        run: node scripts/test-inference-outputs.mjs
      - name: Test restart job receipt journal
        run: bun scripts/test-job-journal.ts
      - name: Test complete Quick Help coverage
        run: bun scripts/test-help-content.ts
