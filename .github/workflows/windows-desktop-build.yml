name: windows-desktop-build

# Windows build automation for Local Audio Studio.
#
# This workflow BUILDS and VERIFIES; it does NOT publish a release. Release
# publication is manual and gated on the licensing checks recorded in
# inference/models/PROVENANCE.md (the bundled default model's redistribution
# rights must be confirmed before any public distribution).
#
# NOTE: authored in the Linux development sandbox; it has never been executed
# here (no Windows runner access). First run on GitHub Actions will likely need
# minor path/timeout adjustments.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference/requirements/cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Verify inference imports (CPU providers only)
        run: python -c "import onnxruntime as ort; assert 'CPUExecutionProvider' in ort.get_available_providers(); from audio_separator.separator import Separator; print('inference deps OK')"

      - name: Worker protocol smoke test (init handshake)
        shell: bash
        run: |
          echo '{"type":"init","protocolVersion":1}' | python inference/worker/main.py 2>stderr.log | tee stdout.log
          grep -q '"type":"ready"' stdout.log || (cat stderr.log && exit 1)

      - name: Real CPU separation smoke test (10 s fixture)
        shell: bash
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=10" -f lavfi -i "sine=frequency=110:duration=10" -filter_complex "[0]volume=0.4[v];[1]volume=0.3[i];[v][i]amix=inputs=2:duration=longest" -ar 44100 -ac 2 test_song.wav
          python scripts/verify-separation.py --input test_song.wav --out ./sep-out
          ls -la ./sep-out

      - name: Package inference worker (PyInstaller onedir)
        run: |
          pip install pyinstaller
          cd inference/worker
          pyinstaller inference-worker.spec --noconfirm --distpath ../../inference-dist/windows-x64
          cd ../..
          cp inference/worker/runtime-manifest.json inference-dist/windows-x64/ 2>/dev/null || true
          ls -la inference-dist/windows-x64

      - name: Verify packaged worker runs without a global Python
        shell: bash
        run: |
          ./inference-dist/windows-x64/inference-worker.exe --help 2>&1 | head -5 || true
          # NOTE: full model-load verification of the packaged exe is manual
          # until the default model's redistribution is approved for CI caching.

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node (electron-builder)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck (renderer + electron)
        run: |
          bun run typecheck
          bun run typecheck:electron

      - name: Compile Electron main/preload
        run: bun run electron:compile

      - name: Build renderer (Next.js static export)
        run: bun run electron:build-renderer

      - name: Package Windows installer
        env:
          # Signing is optional for verification builds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run dist:win

      - name: Stage bundled model (verification builds only)
        # The default model is downloaded here for INTERNAL verification builds.
        # It must NOT be attached to a public release until the licensing gate
        # in inference/models/PROVENANCE.md is cleared.
        shell: bash
        run: |
          mkdir -p resources/models/default
          curl -L -o resources/models/default/model.onnx "https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_5.onnx"
          echo "811cb24095d865763752310848b7ec86aeede0626cb05749ab35350e46897000  resources/models/default/model.onnx" | sha256sum -c -

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            release/*.exe
            inference-dist/windows-x64/
          retention-days: 14
